services:
  postgres:
    image: postgres:15
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.9.1
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__BASE_URL: 'http://localhost:8080'
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: '/opt/airflow/logs'
      AIRFLOW__WEBSERVER__LOG_FETCH_TIMEOUT_SEC: '5'
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '120'
      PIPELINE_DATA_DIR: /opt/airflow/data
      _PIP_ADDITIONAL_REQUIREMENTS: 'dbt-postgres==1.7.0 pytest==8.3.3'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./dbt_project:/opt/airflow/dbt_project
      - ./tests:/opt/airflow/tests
      - ./pytest.ini:/opt/airflow/pytest.ini
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: standalone

  dashboard:
    image: python:3.11-slim
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    working_dir: /app
    command: >
      bash -c "pip install --quiet -r requirements.txt &&
               streamlit run app.py --server.port=8501 --server.address=0.0.0.0"

volumes:
  pgdata:
