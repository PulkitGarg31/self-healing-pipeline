services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    # No published port: Airflow and the dashboard reach it inside Docker, and a local
    # PostgreSQL on the host often already uses 5432. Use `docker compose exec postgres psql`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.9.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__BASE_URL: 'http://localhost:8080'
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: '/opt/airflow/logs'
      AIRFLOW__WEBSERVER__LOG_FETCH_TIMEOUT_SEC: '5'
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: '120'
      PIPELINE_DATA_DIR: /opt/airflow/data
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_DASHBOARD_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_DASHBOARD_PASSWORD}
      _AIRFLOW_WWW_USER_ROLE: User
      _AIRFLOW_WWW_USER_FIRSTNAME: Dashboard
      _AIRFLOW_WWW_USER_LASTNAME: Buttons
      _AIRFLOW_WWW_USER_EMAIL: dashboard@example.com
      _PIP_ADDITIONAL_REQUIREMENTS: 'dbt-postgres==1.7.0 pytest==8.3.3'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./dbt_project:/opt/airflow/dbt_project
      - ./tests:/opt/airflow/tests
      - ./pytest.ini:/opt/airflow/pytest.ini
      - ./data:/opt/airflow/data
      - ./dashboard:/opt/airflow/dashboard:ro
    ports:
      - "127.0.0.1:8080:8080"
    command: standalone
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  dashboard:
    image: python:3.11-slim
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      PIPELINE_DATA_DIR: /data
      AIRFLOW_API_URL: http://airflow:8080/api/v1
    volumes:
      - ./dashboard:/app
      - ./data:/data:ro
    working_dir: /app
    command: >
      bash -c "pip install --quiet -r requirements.txt &&
               streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --browser.gatherUsageStats=false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  pgdata:
